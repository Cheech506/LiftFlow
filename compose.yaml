name: liftflow

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${LIFTFLOW_POSTGRES_DB:-liftflow}
      POSTGRES_USER: ${LIFTFLOW_POSTGRES_USER:-liftflow}
      POSTGRES_PASSWORD: ${LIFTFLOW_POSTGRES_PASSWORD:?Copy .env.example to .env and set LIFTFLOW_POSTGRES_PASSWORD}
    volumes:
      - liftflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build:
      context: ./server
      target: runtime
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LIFTFLOW_ENVIRONMENT: ${LIFTFLOW_ENVIRONMENT:-development}
      LIFTFLOW_POSTGRES_HOST: postgres
      LIFTFLOW_POSTGRES_PORT: 5432
      LIFTFLOW_POSTGRES_DB: ${LIFTFLOW_POSTGRES_DB:-liftflow}
      LIFTFLOW_POSTGRES_USER: ${LIFTFLOW_POSTGRES_USER:-liftflow}
      LIFTFLOW_POSTGRES_PASSWORD: ${LIFTFLOW_POSTGRES_PASSWORD:?Copy .env.example to .env and set LIFTFLOW_POSTGRES_PASSWORD}
      LIFTFLOW_DATABASE_POOL_SIZE: ${LIFTFLOW_DATABASE_POOL_SIZE:-5}
      LIFTFLOW_DATABASE_MAX_OVERFLOW: ${LIFTFLOW_DATABASE_MAX_OVERFLOW:-10}
      LIFTFLOW_ACCESS_TOKEN_MINUTES: ${LIFTFLOW_ACCESS_TOKEN_MINUTES:-30}
      LIFTFLOW_REFRESH_TOKEN_DAYS: ${LIFTFLOW_REFRESH_TOKEN_DAYS:-30}
      LIFTFLOW_CORS_ORIGINS: ${LIFTFLOW_CORS_ORIGINS:-http://localhost:8081,http://127.0.0.1:8081}
    ports:
      - "${LIFTFLOW_API_HOST:-127.0.0.1}:${LIFTFLOW_API_PORT:-8080}:8000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  api-test:
    profiles: ["test"]
    build:
      context: ./server
      target: test
    init: true
    environment:
      LIFTFLOW_ENVIRONMENT: test
      LIFTFLOW_POSTGRES_HOST: postgres
      LIFTFLOW_POSTGRES_DB: ${LIFTFLOW_POSTGRES_DB:-liftflow}
      LIFTFLOW_POSTGRES_USER: ${LIFTFLOW_POSTGRES_USER:-liftflow}
      LIFTFLOW_POSTGRES_PASSWORD: ${LIFTFLOW_POSTGRES_PASSWORD:?Copy .env.example to .env and set LIFTFLOW_POSTGRES_PASSWORD}
      LIFTFLOW_ACCESS_TOKEN_MINUTES: ${LIFTFLOW_ACCESS_TOKEN_MINUTES:-30}
      LIFTFLOW_REFRESH_TOKEN_DAYS: ${LIFTFLOW_REFRESH_TOKEN_DAYS:-30}
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  liftflow_postgres_data:
